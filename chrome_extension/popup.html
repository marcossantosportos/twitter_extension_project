<!DOCTYPE html>
<html>
<head>
  <title>Twitter Sentiment</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 320px;
      max-width: 320px;
      padding: 12px;
      background-color: #000000;
      color: #ffffff;
      border-radius: 18px;
      border: 1px solid #2a2a2a;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 18px;
      text-align: center;
      color: #ffffff;
    }
    /* The button style can be removed if you want to clean up the CSS */
    #result {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.4;
    }
    h4 {
      margin: 8px 0 5px 0;
      color: #d9534f;
    }
    .copy-btn {
      background-color: #1da1f2;
      color: #ffffff;
      border: none;
      padding: 4px 8px;
      margin-left: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .copy-btn:hover {
      background-color: #1a8cd8;
    }
    .copy-btn:active {
      background-color: #1773b3;
    }
    .copy-btn.copied {
      background-color: #28a745;
    }
    .info-row {
      margin: 8px 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }
    .info-row b {
      margin-right: 4px;
    }
    .tweet-preview {
      margin-top: 12px;
      padding: 10px;
      background-color: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      border-left: 3px solid #1da1f2;
      font-size: 13px;
      line-height: 1.5;
      max-height: 150px;
      overflow-y: auto;
      word-wrap: break-word;
    }
    .tweet-preview-header {
      font-size: 11px;
      color: #888;
      margin-bottom: 6px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .tweet-preview-text {
      color: #ffffff;
      white-space: pre-wrap;
    }
    .song-btn {
      background-color: #3cb371;
      color: #ffffff;
      border: none;
      padding: 8px 10px;
      margin-top: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      width: 100%;
      transition: background-color 0.2s;
    }
    .song-btn:hover {
      background-color: #35a066;
    }
    .song-btn:active {
      background-color: #2e8b57;
    }
    .call-btn {
      background-color: #dc3545;
      color: #ffffff;
      border: none;
      padding: 8px 10px;
      margin-top: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      width: 100%;
      transition: background-color 0.2s;
    }
    .call-btn:hover {
      background-color: #c82333;
    }
    .call-btn:active {
      background-color: #bd2130;
    }
    #chatbot-section {
      margin-top: 12px;
      padding: 12px;
      background-color: #1a1a1a;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
    }
    .chatbot-message {
      margin-bottom: 10px;
      font-size: 13px;
      color: #ffffff;
      line-height: 1.5;
    }
    .chatbot-buttons {
      display: flex;
      gap: 8px;
    }
    .chatbot-btn {
      flex: 1;
      border: none;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      transition: background-color 0.2s;
    }
    .chatbot-btn-yes {
      background-color: #28a745;
      color: white;
    }
    .chatbot-btn-yes:hover {
      background-color: #218838;
    }
    .chatbot-btn-no {
      background-color: #6c757d;
      color: white;
    }
    .chatbot-btn-no:hover {
      background-color: #5a6268;
    }
    .chatbot-buttons .call-btn,
    .chatbot-buttons .song-btn {
      width: auto;
      margin-top: 0;
      flex: 1;
    }
    #music-player {
      display: none;
      margin-top: 12px;
      border-radius: 12px;
      overflow: hidden;
    }
    #youtube-player {
      width: 100%;
      height: 200px;
      border: none;
    }
    #chatbot-container {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background-color: #1a1a1a;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
    }
    #chatbot-container.active {
      display: block;
    }
    #chatbot-messages {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 12px;
      padding: 8px;
      background-color: #0a0a0a;
      border-radius: 8px;
    }
    .chatbot-message {
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
    }
    .chatbot-message.bot {
      background-color: #2a2a2a;
      color: #ffffff;
    }
    .chatbot-message.user {
      background-color: #1da1f2;
      color: #ffffff;
      text-align: right;
    }
    #chatbot-input-container {
      display: none;
      margin-bottom: 12px;
    }
    #chatbot-input-container.active {
      display: block;
    }
    #chatbot-input {
      width: 100%;
      padding: 8px;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      background-color: #0a0a0a;
      color: #ffffff;
      font-size: 13px;
      box-sizing: border-box;
    }
    #chatbot-input:focus {
      outline: none;
      border-color: #1da1f2;
    }
    #chatbot-send-btn {
      margin-top: 8px;
      padding: 6px 12px;
      background-color: #1da1f2;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
    #chatbot-send-btn:hover {
      background-color: #1a8cd8;
    }
    #chatbot-action-buttons {
      display: none;
      gap: 8px;
      margin-top: 12px;
    }
    #chatbot-action-buttons.active {
      display: flex;
    }
    #chatbot-action-buttons button {
      flex: 1;
    }
    #chatbot-resources-view {
      display: none;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 12px;
    }
    #chatbot-resources-view.active {
      display: block;
    }
    .resources-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #2a2a2a;
    }
    .resources-back-btn {
      background-color: #6c757d;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }
    .resources-back-btn:hover {
      background-color: #5a6268;
    }
    .resources-category {
      margin-bottom: 16px;
    }
    .resources-category-title {
      font-size: 14px;
      font-weight: bold;
      color: #1da1f2;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #2a2a2a;
    }
    .resource-item {
      background-color: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .resource-item-title {
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .resource-item-summary {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .resource-item-kind {
      display: inline-block;
      font-size: 10px;
      color: #1da1f2;
      background-color: #1a1a1a;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 6px;
    }
    .resource-open-btn {
      background-color: #1da1f2;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      margin-top: 6px;
    }
    .resource-open-btn:hover {
      background-color: #1a8cd8;
    }
    .resources-safety-note {
      font-size: 10px;
      color: #dc3545;
      margin-top: 12px;
      padding: 8px;
      background-color: #1a1a1a;
      border-left: 3px solid #dc3545;
      border-radius: 4px;
    }
    .resources-btn {
      background-color: #9b59b6;
      color: #ffffff;
      border: none;
      padding: 8px 10px;
      margin-top: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      width: 100%;
      transition: background-color 0.2s;
    }
    .resources-btn:hover {
      background-color: #8e44ad;
    }
    .resources-btn:active {
      background-color: #7d3c98;
    }
  </style>
</head>
<body>
  <h3>Sentiment Tool</h3>
  <div id="result">Loading analysis...</div>
  <div id="chatbot-container">
    <div id="chatbot-messages"></div>
    <div id="chatbot-input-container">
      <input type="text" id="chatbot-input" placeholder="Type your response...">
      <button id="chatbot-send-btn">Send</button>
    </div>
    <div id="chatbot-action-buttons">
      <button class="call-btn" id="chatbot-message-btn">💬 Message someone close</button>
      <button class="song-btn" id="chatbot-song-btn">Play an upbeat song</button>
      <button class="resources-btn" id="chatbot-resources-btn">📚 Resources (CBT/DBT)</button>
    </div>
    <div id="chatbot-resources-view">
      <div class="resources-header">
        <span style="font-weight: bold; font-size: 14px;">Resource Library</span>
        <button class="resources-back-btn" id="resources-back-btn">← Back to Chat</button>
      </div>
      <div id="resources-content">
        <div style="text-align: center; color: #888; padding: 20px;">Loading resources...</div>
      </div>
      <div class="resources-safety-note">
        ⚠️ If you feel unsafe or are in immediate danger, please contact your local emergency services or helpline immediately.
      </div>
    </div>
  </div>
  <div id="music-player">
    <iframe 
      id="youtube-player"
      width="100%" 
      height="200" 
      src="" 
      frameborder="0" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>
  </div>

  <script src="popup.js"></script>
</body>
</html>
